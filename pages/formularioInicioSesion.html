<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/botonTema.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/formulario.css">
</head>

<body class="flex items-center justify-center h-screen">
  <form action="procesar_formulario.php" method="POST" class="formulario w-full max-w-md p-4">
    <fieldset class="formulario__fieldset flex flex-col gap-7 p-6 items-start justify-center rounded-[10px] shadow-md w-full">
      <legend class="text-lg font-bold text-center">Iniciar sesión</legend>

      <a href="../pages/menu.html" class="text-blue-500 hover:text-blue-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-arrow-left preview-icon">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
      </a>

      <div class="flex flex-col gap-2 w-full">
        <label for="inp_email">Correo electrónico</label>
        <input class="border border-gray-300 rounded py-1 px-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"
          type="email" id="inp_email" name="email" placeholder="Ingrese su correo electrónico" required>
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label for="inp_password">Contraseña:</label>
        <input class="border border-gray-300 rounded py-1 px-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"
          type="password" id="inp_password" name="password" placeholder="Ingrese su contraseña" required>
      </div>

      <div class="flex flex-row gap-2 w-full">
        <button type="submit">Iniciar sesión</button>
        <button type="reset">Restablecer</button>
      </div>

      <div class="text-sm">
        <span>¿No tienes cuenta? </span>
        <a href="formularioRegistro.html" class="text-blue-500 hover:text-blue-700 underline">Regístrate</a>
      </div>

    </fieldset>
  </form>

  <button class="fixed bottom-6 right-0 z-50 bg-black/50 hover:bg-black/70 text-4xl font-bold py-5 px-4 rounded-l-lg"
    id="theme-toggle" aria-label="Cambiar modo claro/oscuro">☀️
  </button>
</body>

</html>
