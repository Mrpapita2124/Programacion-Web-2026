<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/formularioInicioSesion.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/formulario.css">
</head>

<body class="flex items-center justify-center h-screen">
  <form action="procesar_formulario.php" method="POST" class="formulario w-full max-w-md p-4" novalidate>
    <fieldset class="formulario__fieldset flex flex-col gap-5 p-6 items-start justify-center rounded-[10px] shadow-md w-full">
      
      <div class="flex items-center w-full relative mb-2">
        <a href="../pages/menu.html" class="text-blue-500 hover:text-blue-700 absolute left-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-arrow-left preview-icon">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </a>
        <legend class="text-2xl font-bold text-center w-full">Iniciar sesión</legend>
      </div>

      <br>
      <div class="flex flex-col gap-2 w-full">
        <label for="inp_email">Correo electrónico</label>
        <input class="border border-gray-300 rounded py-1 px-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"
          type="email" id="inp_email" name="email" placeholder="Ingrese su correo electrónico">
        <span class="error-campo" data-error-para="email"></span>
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label for="inp_password">Contraseña:</label>
        <input class="border border-gray-300 rounded py-1 px-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"
          type="password" id="inp_password" name="password" placeholder="Ingrese su contraseña">
        <span class="error-campo" data-error-para="password"></span>
      </div>

      <div class="w-full mt-2">
        <button type="submit" class="w-full py-2">Iniciar sesión</button>
      </div>

    
      <div class="flex flex-row justify-between items-center w-full text-sm mt-1">
        <div>
          <span>¿No tienes cuenta? </span>
          <a href="formularioRegistro.html" class="text-blue-500 hover:text-blue-700 underline">Regístrate</a>
        </div>
        <button type="reset">Restablecer</button>
      </div>

    </fieldset>
  </form>

  <button class="fixed bottom-6 right-0 z-50 bg-black/50 hover:bg-black/70 text-4xl font-bold py-5 px-4 rounded-l-lg"
    id="theme-toggle" aria-label="Cambiar modo claro/oscuro">☀️
  </button>
</body>

</html>
