
<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/menu.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/menu.css">

    <title>Menu de Productos</title>
</head>

<body class="w-full h-full m-0">

    <div class="contenedor">

        <header class="flex justify-around items-center p-4 gap-4" id="header">
        
          <input type="text" id="busqueda" name="usuario" placeholder="Buscar Producto" class="w-1/2 h-10 rounded placeholder:opacity-50 pl-3">
        </header>

        <nav id="nav">
            <button data-categoria="todas" class="active">Todas</button>
            <button data-categoria="bebidas frías">Bebidas frías</button>
            <button data-categoria="calientes">Calientes</button>
            <button data-categoria="postres">Postres</button>
            <button data-categoria="extras">Extras</button>
        </nav>

        <main id="main">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="contenedor-tarjetas">
            </div>
        </main>

    </div>

</body>

</html>
