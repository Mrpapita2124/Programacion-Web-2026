<!DOCTYPE html>
<html lang="es">

<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script type="module" src="../js/menu.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/menu.css">

  <title>Menu de Productos</title>
</head>

<body class="w-full min-h-screen m-0 flex flex-col justify-between antialiased">

  <header class="sticky top-0 z-30 w-full shadow-md backdrop-blur-md border-b border-black/10 dark:border-white/10 transition-colors duration-300" id="header">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 sm:gap-6 px-4 sm:px-8 py-3">
      <a href="../index.html" class="shrink-0">
        <img src="../assets/img/logo.png" alt="Logo de 40-20 Café" class="h-12 sm:h-16 w-auto transition-transform duration-300 hover:scale-105">
      </a>

      <input type="text" id="busqueda" name="usuario" placeholder="Buscar Producto..."
        class="flex-1 max-w-xl h-10 sm:h-11 rounded-xl px-4 bg-white/90 dark:bg-black/30 text-stone-900 dark:text-stone-100 placeholder:text-stone-500 dark:placeholder:text-stone-400 border border-black/15 dark:border-white/15 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">

      <a href="../pages/formularioInicioSesion.html"
        class="shrink-0 p-2.5 sm:p-3 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/15 dark:hover:bg-white/20 transition-all duration-300 hover:scale-105 flex items-center justify-center"
        aria-label="Iniciar sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-user preview-icon">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto flex-1 flex flex-col md:flex-row gap-6 p-4 sm:p-6 lg:p-8">

    <nav id="nav" class="w-full md:w-56 lg:w-64 shrink-0 rounded-2xl shadow-lg border border-black/5 dark:border-white/10 self-start md:sticky md:top-24">
      <div class="flex flex-row flex-wrap md:flex-col gap-2.5">
        <button data-categoria="todas" class="active !w-auto md:!w-full flex-1 md:flex-none px-4">Todas</button>
        <button data-categoria="bebidas frías" class="!w-auto md:!w-full flex-1 md:flex-none px-4">Bebidas frías</button>
        <button data-categoria="calientes" class="!w-auto md:!w-full flex-1 md:flex-none px-4">Calientes</button>
        <button data-categoria="postres" class="!w-auto md:!w-full flex-1 md:flex-none px-4">Postres</button>
        <button data-categoria="extras" class="!w-auto md:!w-full flex-1 md:flex-none px-4">Extras</button>
      </div>
    </nav>

    <main id="main" class="flex-1 min-w-0">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 w-full" id="contenedor-tarjetas">
      </div>
    </main>

  </div>

  <footer class="footer w-full py-10 px-4 sm:px-8 mt-12 border-t border-black/10 dark:border-white/10" style="background-color: var(--fondo_alterno); color: var(--texto);">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-around items-center sm:items-start gap-8 text-center sm:text-left">
      <div>
        <h3 class="text-lg sm:text-xl font-bold mb-3 tracking-wide">Sobre Nosotros</h3>
        <ul class="flex flex-col gap-2 text-sm sm:text-base font-semibold">
          <li>
            <a href="trabaja_con_nosotros.html" class="opacity-80 hover:opacity-100 hover:text-[var(--selecionado)] transition">
              Trabaja con nosotros
            </a>
          </li>
          <li>
            <a href="ubicaciones.html" class="opacity-80 hover:opacity-100 hover:text-[var(--selecionado)] transition">
              Ubicaciones
            </a>
          </li>
        </ul>
      </div>

      <div>
        <h3 class="text-lg sm:text-xl font-bold mb-3 tracking-wide">Atención al Cliente</h3>
        <ul class="flex flex-col gap-2 text-sm sm:text-base font-semibold">
          <li>
            <a href="tel:+526121310955" class="opacity-80 hover:opacity-100 hover:text-[var(--selecionado)] transition" title="Número de contacto">
              Contáctanos
            </a>
          </li>
          <li>
            <a href="mailto:azariascollins20@gmail.com" class="opacity-80 hover:opacity-100 hover:text-[var(--selecionado)] transition">
              Facturas electrónicas
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="mt-8 pt-6 border-t border-black/10 dark:border-white/10 text-center text-xs sm:text-sm opacity-85 leading-relaxed max-w-4xl mx-auto">
      <p class="italic">© 2026 40-20 Café. Todos los derechos reservados.</p>
      <p class="font-bold my-1">Jose Carlos Arce Lopez, Irving Adrian Romero Hernandez, Azarias Villanueva Collins</p>
      <p class="text-xs opacity-75">Versión 1.0.1</p>
    </div>
  </footer>
  
  <button class="fixed bottom-6 right-0 z-50 bg-black/55 hover:bg-black/75 backdrop-blur-md text-3xl sm:text-4xl font-bold py-4 px-3.5 sm:py-5 sm:px-4 rounded-l-2xl shadow-xl transition-all duration-300 hover:scale-105"
    id="theme-toggle" aria-label="Cambiar modo claro/oscuro">☀️
  </button>
</body>

</html>
