<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/menu.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/menu.css">

  <title>Menu de Productos</title>
</head>

<body class="w-full h-full m-0">

  <div class="contenedor">

    <header class="flex justify-around items-center p-3 gap-4 shadow-sm" id="header">
      <a href="../index.html">
        <img src="../assets/img/logo.png" alt="Logo de 40-20 Café" class="h-16">
      </a>
      
      <input type="text" id="busqueda" name="usuario" placeholder="Buscar Producto..."
        class="w-1/2 h-10 rounded-lg placeholder:opacity-50 pl-4 border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
      
        
      <a href="../pages/formularioInicioSesion.html" class="p-2.5 rounded-full bg-black/5 hover:bg-black/10 transition flex items-center justify-center" aria-label="Iniciar sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-user preview-icon">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
    </header>

    <nav id="nav">
      <div class="sticky top-7 flex flex-col gap-2 p-2">
        <button data-categoria="todas" class="active">Todas</button>
        <button data-categoria="bebidas frías">Bebidas frías</button>
        <button data-categoria="calientes">Calientes</button>
        <button data-categoria="postres">Postres</button>
        <button data-categoria="extras">Extras</button>
      </div>
    </nav>

    <main id="main" class="p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full" id="contenedor-tarjetas">
      </div>
    </main>

  </div>
  
  <button class="fixed bottom-6 right-0 z-50 bg-black/50 hover:bg-black/70 text-4xl font-bold py-5 px-4 rounded-l-lg"
    id="theme-toggle" aria-label="Cambiar modo claro/oscuro">☀️
  </button>
</body>

</html>
